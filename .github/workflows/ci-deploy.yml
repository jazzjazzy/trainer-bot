name: CI & Deploy

# Gates run on GitHub-hosted runners for every push and PR.
# Deploy runs only for pushes to main, and only if the gates pass. It runs on
# the self-hosted runner on the Coolify host, because the Coolify API listens
# on the LAN (10.11.12.103:8000) and is deliberately not exposed to the
# internet — the runner reaches it over localhost.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# One run per branch; a newer push supersedes an in-flight one. Deploys are
# not cancelled mid-flight — see the deploy job's own concurrency group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Typecheck, content, build
    runs-on: ubuntu-latest
    env:
      # GitHub's runners ship Xdebug, which replaces var_dump: it prefixes
      # every dump with file:line and prints `double(3.5)` where stock PHP
      # prints `float(3.5)`. The lessons document stock PHP, so turn Xdebug
      # off rather than baking Xdebug's format into the course content.
      # Quoted because bare `off` is boolean false in YAML.
      XDEBUG_MODE: "off"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # verify-content skips PHP/Python snippets with a warning when the
      # interpreter is absent, and still exits 0. Fail loudly instead, so a
      # change to the runner image can't quietly weaken the gate.
      - name: Assert interpreters present
        run: |
          set -euo pipefail
          php --version | head -1
          python3 --version
          test -z "$(php -m | grep -i '^xdebug$' || true)" \
            || echo "note: xdebug is loaded but XDEBUG_MODE=off disables its var_dump override"

      # Executes every playground in every lesson and checks quiz integrity.
      # PHP and Python are present on ubuntu-latest, so the PHP/Python
      # snippets really run here rather than being skipped with a warning.
      - name: Verify course content
        run: npm run verify

      - name: Build
        run: npm run build

      # The production server is what Coolify will actually run, so prove it
      # boots and serves the build before we let a deploy happen.
      - name: Smoke-test production server
        run: |
          set -euo pipefail
          PORT=3999 node server/index.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:3999/; then break; fi
            if [ "$i" = 20 ]; then echo "server did not come up"; exit 1; fi
            sleep 0.5
          done

          echo "index.html served"
          asset=$(curl -fsS http://127.0.0.1:3999/ \
            | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          test -n "$asset" || { echo "no hashed bundle referenced"; exit 1; }
          curl -fsS -o /dev/null "http://127.0.0.1:3999/$asset"
          echo "bundle $asset served"

          # No API key in CI, so the tutor must fail cleanly as JSON rather
          # than crashing the process.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{}' \
            http://127.0.0.1:3999/api/ask)
          test "$code" = "400" || { echo "/api/ask returned $code, expected 400"; exit 1; }
          echo "/api/ask reachable and validating input"

          # The site is unlisted — assert it stays that way.
          curl -fsS http://127.0.0.1:3999/robots.txt | grep -q '^Disallow: /$' \
            || { echo "robots.txt is not disallowing crawlers"; exit 1; }
          curl -fsSI http://127.0.0.1:3999/ | grep -qi '^x-robots-tag:.*noindex' \
            || { echo "X-Robots-Tag noindex header missing"; exit 1; }
          echo "crawler directives present"

  deploy:
    name: Deploy to Coolify
    needs: gates
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, coolify]
    # Never run two deploys of the same app at once, and never cancel one
    # half-way through.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # 127.0.0.1, not localhost: localhost resolves to ::1 first, which takes
      # the IPv6 docker-proxy into the Coolify container. Coolify then sees an
      # IPv6 source address that its API allowlist doesn't cover, and answers
      # 403. The IPv4 path arrives from the bridge gateway (10.0.1.1), which is
      # allowlisted. curl is also pinned to -4 so a hosts-file change can't
      # quietly reintroduce the problem.
      COOLIFY_URL: http://127.0.0.1:8000
      COOLIFY_APP_UUID: cd0aw5iyjsl5t5dluoltbdp6
    steps:
      - name: Trigger Coolify deployment
        run: |
          set -euo pipefail
          body=$(mktemp)
          # Deliberately not using curl -f: it swallows the response body, and
          # Coolify explains *why* it refused in that body.
          status=$(curl -4 -sS -o "$body" -w '%{http_code}' -X GET \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false")

          echo "HTTP $status"
          echo "--- response body ---"
          cat "$body"; echo
          echo "---------------------"

          case "$status" in
            200|201) ;;
            401) echo "::error::Coolify rejected the token (401) — COOLIFY_TOKEN is invalid or expired."; exit 1 ;;
            403) echo "::error::Coolify authenticated the token but refused the action (403). Check the token has deploy+write permission, and that Settings → API has no IP allowlist blocking this runner."; exit 1 ;;
            404) echo "::error::Coolify has no application with uuid ${COOLIFY_APP_UUID} (404)."; exit 1 ;;
            *)   echo "::error::Coolify returned HTTP $status"; exit 1 ;;
          esac

          grep -q deployment_uuid "$body" \
            || { echo "::error::Coolify returned $status but queued no deployment"; exit 1; }

      - name: Summary
        run: |
          {
            echo "### Deployed to Coolify"
            echo ""
            echo "- commit: \`${GITHUB_SHA::7}\`"
            echo "- app: \`${COOLIFY_APP_UUID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
