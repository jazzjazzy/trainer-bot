# Course content is teaching material: it deliberately contains
# credential-SHAPED example strings (Stripe key prefixes, AWS-style access
# key IDs, bearer tokens) so learners can recognise the real thing. None of
# them are live credentials — the values are vendor documentation samples or
# invented.
#
# Without this, secret scanning raises an alert (and push protection blocks)
# every time a section teaches API keys, env vars or secrets management.
#
# Trade-off, stated deliberately: real secrets committed under src/courses/
# would NOT be caught. Nothing under that path should ever contain a working
# credential; anything that does is a bug regardless of scanning.
paths-ignore:
  - "src/courses/**"
